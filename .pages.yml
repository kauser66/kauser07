media:
  input: images
  output: images

content:
  - name: news
    label: সংবাদ
    type: list
    path: data/news
    fields:
      - {name: title, label: শিরোনাম, type: text, required: true}
      - {name: date, label: তারিখ (যেমন: ১০ নভেম্বর ২০২৬), type: text}
      - {name: cat, label: ক্যাটাগরি (যেমন: স্থানীয়, শিক্ষা), type: text}
      - {name: photo, label: ছবি, type: image}
      - {name: text, label: বিস্তারিত, type: text}

  - name: people
    label: পরিচিত মুখ
    type: list
    path: data/people
    fields:
      - {name: name, label: নাম, type: text, required: true}
      - {name: photo, label: ছবি, type: image}
      - {name: title, label: পদবি, type: text}
      - {name: nick, label: ডাকনাম, type: text}
      - {name: house, label: বাড়ির নাম, type: text}
      - {name: address, label: ঠিকানা, type: text}
      - {name: about, label: পরিচিতি, type: text}
      - {name: phone, label: ফোন নম্বর, type: text}
      - {name: map, label: গুগল ম্যাপ লিংক, type: text}
      - {name: fb, label: ফেসবুক লিংক, type: text}

  - name: mosque
