<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>জমা পর্যালোচনা</title><style>body{font-family:system-ui,'Noto Sans Bengali',sans-serif;background:#f0f2f5;color:#222;margin:0;padding:20px}.wrap{max-width:850px;margin:auto}.card{background:#fff;border-radius:12px;padding:16px;margin:12px 0;box-shadow:0 2px 8px #0001}.actions{display:flex;gap:8px;margin-top:12px}button{padding:10px 14px;border:0;border-radius:7px;color:white;background:#1976d2}button.no{background:#c62828}input{padding:9px;max-width:100%}img{max-width:180px;display:block;border-radius:8px}small{color:#666}</style></head><body><main class="wrap"><h1>জমা পর্যালোচনা</h1><p>এই পৃষ্ঠা Cloudflare Access দিয়ে Admin হিসেবে সুরক্ষিত রাখতে হবে।</p><label>Worker API URL <input id="api" placeholder="https://your-worker.workers.dev"></label><button id="load">Pending জমা দেখুন</button><div id="list"></div><p id="msg" role="status"></p></main><script>
const $=s=>document.querySelector(s);$("#load").onclick=load;
async function call(path,body){const r=await fetch($("#api").value.replace(/\\/$/,"")+path,{method:body===undefined?"GET":"POST",headers:body===undefined?{}:{"content-type":"application/json"},body:body===undefined?undefined:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw Error(j.error||"সমস্যা হয়েছে");return j}
async function load(){try{const j=await call("/api/admin/pending");$("#list").innerHTML="";j.items.forEach(x=>{const c=document.createElement("article");c.className="card";const h=document.createElement("h3");h.textContent=(x.kind==="news"?"সংবাদ: ":"স্বেচ্ছাসেবক: ")+(x.title||x.name);c.append(h);const p=document.createElement("p");p.textContent="জমাদানকারী: "+x.submitter;c.append(p);if(x.photo){const im=document.createElement("img");im.src=x.photo;im.alt="জমা দেওয়া ছবি";c.append(im)}const d=document.createElement("p");d.textContent=x.text||x.about||"";c.append(d);if(x.kind==="news"){const label=document.createElement("label");label.textContent="প্রকাশের মেয়াদ (দিন): ";const n=document.createElement("input");n.type="number";n.min="1";n.max="365";n.value="7";label.append(n);c.append(label);c.dataset.daysInput="";c._days=n}const a=document.createElement("div");a.className="actions";const yes=document.createElement("button");yes.textContent="অনুমোদন";yes.onclick=async()=>{try{await call("/api/admin/approve/"+x.id,x.kind==="news"?{days:Number(c._days.value)}:{});await load()}catch(e){$("#msg").textContent=e.message}};const no=document.createElement("button");no.className="no";no.textContent="বাতিল";no.onclick=async()=>{try{await call("/api/admin/decline/"+x.id,{});await load()}catch(e){$("#msg").textContent=e.message}};a.append(yes,no);c.append(a);$("#list").append(c)});$("#msg").textContent=j.items.length?"":"কোনো Pending জমা নেই।"}catch(e){$("#msg").textContent=e.message}}
</script></body></html>
