<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>শাহবাজপুর পূর্বপাড়া - আমাদের গ্রাম, আমাদের গর্ব</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--red:#d32f2f;--dark:#121e31;--text:#222;--light:#666;--bg:#f0f2f5;--bd:#e0e0e0}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Hind Siliguri',sans-serif}
html{scroll-behavior:smooth;scroll-padding-top:10px}
body{background:var(--bg);color:var(--text);line-height:1.6;overflow-x:hidden}
a{text-decoration:none;color:inherit}img{max-width:100%;display:block}
.container{width:100%;max-width:1200px;margin:0 auto;padding:0 15px}
@keyframes floating{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes shine{100%{left:125%}}
@keyframes glow{0%,100%{box-shadow:0 0 5px rgba(211,47,47,.5)}50%{box-shadow:0 0 20px rgba(211,47,47,.9)}}
@keyframes flash{from{opacity:1}to{opacity:.4;color:#ffeb3b}}
@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
@keyframes bgmove{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:.7}100%{transform:translateY(-110vh) scale(1.2);opacity:0}}
@keyframes shimmer{to{background-position:200% center}}
@keyframes popin{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.reveal{opacity:0;transform:translateY(40px) scale(.98);transition:opacity .8s cubic-bezier(.16,1,.3,1),transform .8s cubic-bezier(.16,1,.3,1)}
.reveal.in{opacity:1;transform:none}
.top-bar{background:var(--dark);color:#fff;font-size:14px;padding:8px 0;border-bottom:2px solid var(--red)}
.top-bar .container{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.ti{display:flex;gap:20px;align-items:center;flex-wrap:wrap}.ti span{display:flex;align-items:center;gap:6px}.ti i{animation:floating 3s ease-in-out infinite;color:var(--red)}
#dynamic-date,#dynamic-time{font-family:'Noto Sans Bengali','Hind Siliguri',sans-serif;font-size:15px;font-weight:500;letter-spacing:.6px;font-variant-numeric:tabular-nums}
.header-main{background:#fff;padding:15px 0;border-bottom:2px solid var(--red)}
.header-main .container{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px}
.logo-area{display:flex;align-items:center;gap:12px}.logo-area img{width:65px;border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,.15);transition:transform .5s cubic-bezier(.175,.885,.32,1.275)}.logo-area img:hover{transform:rotate(8deg) scale(1.04)}
.logo-text h1{font-size:34px;margin-bottom:-5px;font-weight:700}.logo-text h1 span{color:var(--red)}.logo-text p{font-size:14px;color:var(--light);font-weight:500}
.search-box{display:flex;border:2px solid var(--bd);border-radius:30px;overflow:hidden;background:#f9f9f9;transition:.4s}.search-box:focus-within{box-shadow:0 0 15px rgba(211,47,47,.3);border-color:var(--red)}
.search-box input{padding:10px 20px;border:none;outline:none;width:250px;background:transparent;font-size:15px}.search-box button{background:var(--dark);color:#fff;border:none;padding:0 25px;cursor:pointer;font-weight:600;transition:.3s}.search-box button:hover{background:var(--red)}
.main-nav{background:var(--red);color:#fff;box-shadow:0 4px 10px rgba(0,0,0,.15)}.main-nav .container{display:flex;flex-wrap:wrap}
.main-nav a{flex:0 0 auto;padding:8px 11px;font-weight:500;font-size:14px;display:flex;align-items:center;gap:6px;position:relative;overflow:hidden;transition:.3s}
.main-nav a::before{content:'';position:absolute;top:0;left:-100%;width:50%;height:100%;background:linear-gradient(to right,transparent,rgba(255,255,255,.3),transparent);transform:skewX(-25deg)}.main-nav a:hover::before{animation:shine 1s linear}
.hero{position:relative;overflow:hidden;color:#fff;padding:70px 0 60px;background:linear-gradient(120deg,#0c1626,#1d2f4d,#7f1d1d,#1d2f4d);background-size:300% 300%;animation:bgmove 14s ease infinite}
.hero .bub{position:absolute;bottom:-40px;border-radius:50%;background:rgba(255,255,255,.12);animation:rise linear infinite}.hero .container{position:relative;z-index:2;display:grid;grid-template-columns:1.1fr .9fr;gap:26px;align-items:center}
.hero small{display:inline-block;background:var(--red);padding:5px 16px;border-radius:30px;font-size:14px;margin-bottom:14px;animation:glow 2s infinite}
.hero h2{font-size:clamp(40px,8.5vw,88px);font-weight:700;line-height:1.15;background:linear-gradient(90deg,#fff,#ffcdd2,#fff,#ffeb3b,#fff);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 6s linear infinite}
.hero .sub{font-size:20px;margin:8px 0 6px;opacity:.95;font-weight:500}.hero .slogan{font-size:17px;opacity:.85;margin-bottom:22px}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--red);color:#fff;padding:11px 24px;border-radius:30px;font-weight:600;border:none;cursor:pointer;transition:.3s;margin:0 8px 8px 0}.btn:hover{transform:translateY(-2px);box-shadow:0 12px 25px rgba(211,47,47,.3)}
.hero-photo{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:4/3;background:rgba(255,255,255,.1);border:3px solid rgba(255,255,255,.35);box-shadow:0 20px 50px rgba(0,0,0,.5);animation:float 5s ease-in-out infinite}
.hero-photo::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.12),transparent,rgba(255,255,255,.08));mix-blend-mode:screen}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:14px;margin-top:-35px;position:relative;z-index:5}.stat{background:#fff;border-radius:12px;padding:16px 8px;text-align:center;box-shadow:0 8px 24px rgba(18,30,49,.08);border:1px solid rgba(0,0,0,.04)}.stat strong{display:block;font-size:28px;color:var(--red)}.stat span{font-size:13px;color:var(--light)}
.breaking{background:#fff;margin:25px 0 10px;border-radius:8px;display:flex;align-items:center;box-shadow:0 4px 15px rgba(0,0,0,.05);overflow:hidden;border:1px solid var(--bd)}.bl{background:var(--dark);color:#fff;padding:12px 16px;font-weight:700;display:flex;align-items:center;gap:8px}.tk{padding:12px 16px;overflow:hidden;white-space:nowrap}.tk span{display:inline-block;padding-left:100%;animation:marquee 20s linear infinite}
.sec{padding:30px 0 10px}.stitle{display:flex;align-items:center;justify-content:space-between;border-left:6px solid var(--red);padding-left:14px;margin-bottom:18px}.stitle h3{font-size:26px;color:var(--dark)}.stitle em{font-style:normal;color:var(--red);font-size:14px}
.note{background:#fff;border-radius:10px;padding:16px 20px;margin-bottom:16px;border-left:4px solid #198754;box-shadow:0 3px 10px rgba(0,0,0,.05);color:#333}.sub-t{font-size:20px;margin:22px 0 12px;color:var(--dark);display:flex;align-items:center;gap:8px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:20px}.empty{background:#fff;border:2px dashed var(--bd);border-radius:12px;padding:12px 18px;text-align:center;color:var(--light)}
.ward,.stitle em,.sub-t em,.tag{font-family:'Noto Sans Bengali','Hind Siliguri',sans-serif}.ward{letter-spacing:.4px;display:inline-block;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);padding:4px 10px;border-radius:20px}
#top{position:fixed;right:16px;bottom:16px;width:44px;height:44px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;z-index:900;box-shadow:0 8px 18px rgba(211,47,47,.35)}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 4px 15px rgba(0,0,0,.08);position:relative;display:flex;flex-direction:column;transition:transform .4s,box-shadow .4s}.card:hover{transform:translateY(-5px);box-shadow:0 12px 30px rgba(18,30,49,.14)}
.ph{position:relative;height:200px;background:linear-gradient(135deg,#e8ebf0,#cfd5de);display:flex;align-items:center;justify-content:center;font-size:48px;color:#aab2bf;overflow:hidden;flex:0 0 auto}.ph img{width:100%;height:100%;object-fit:cover;display:block}.cb{padding:16px;flex:1;word-break:break-word}.cb h4{font-size:19px;color:var(--dark);margin-bottom:6px;line-height:1.35}.card:hover h4{color:var(--red)}.row{font-size:14.5px;color:#444;margin-bottom:7px}.row b{color:var(--dark)}.about{margin-top:10px;font-size:14.5px;color:#555;line-height:1.6}
.shops{padding:0 16px 18px}.shops .grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.shops .ph{height:140px}.shops h5{font-size:17px;margin:4px 0 12px;color:var(--dark);border-left:3px solid var(--red);padding-left:10px}
.dev{background:linear-gradient(135deg,var(--dark),#22385c);color:#fff;border-radius:16px;padding:30px;display:grid;grid-template-columns:220px 1fr;gap:28px;align-items:center;box-shadow:0 12px 35px rgba(18,30,49,.15)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:3000;display:none;align-items:center;justify-content:center;padding:15px}#modal.on{display:flex}#modal .mb{background:#fff;border-radius:16px;overflow:hidden;max-width:760px;width:min(92vw,760px);box-shadow:0 22px 60px rgba(0,0,0,.4)}#modal .mc{padding:20px}.close{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.08);border-radius:50%;width:36px;height:36px;display:grid;place-items:center;cursor:pointer}
footer{background:var(--dark);color:#fff;padding:40px 0 18px;border-top:5px solid var(--red);margin-top:40px;text-align:center}footer h2{font-size:30px;margin-bottom:6px}footer p{color:#bbb}.credit{font-size:13px;margin-top:18px;color:#d7d7d7}
@media(max-width:992px){.hero .container{grid-template-columns:1fr}.dev{grid-template-columns:1fr;text-align:center}}@media(max-width:768px){.header-main .container{flex-direction:column;text-align:center}.search-box{width:100%}.search-box input{width:100%}.logo-text h1{font-size:28px}}@media(max-width:460px){.breaking{display:block}.bl{justify-content:center}.tk{white-space:normal}.hero{padding-top:50px}} 
</style>
</head>
<body>
<div class="top-bar"><div class="container"><div class="ti"><span><i class="fas fa-map-marker-alt"></i> শাহবাজপুর পূর্বপাড়া, জামালপুর</span><span><i class="fas fa-phone-alt"></i> +৮৮ ০১৭১২-৩৪৫৬৭৮</span><span><i class="fas fa-clock"></i> <span id="dynamic-date"></span> · <span id="dynamic-time"></span></span></div></div></div>
<header class="header-main"><div class="container"><div class="logo-area"><img src="https://cdn-icons-png.flaticon.com/512/3443/3443338.png" alt="Logo"><div class="logo-text"><h1>আমাদের <span>গ্রাম</span></h1><p>শাহবাজপুর পূর্বপাড়া</p></div></div><div class="search-box"><input type="text" id="searchInput" placeholder="খুঁজুন…"><button type="button" aria-label="Search"><i class="fas fa-search"></i></button></div></div></header>
<nav class="main-nav"><div class="container" id="nav"></div></nav>
<main id="app"></main>
<footer><div class="container"><h2>শাহবাজপুর পূর্বপাড়া</h2><p>জামালপুর সদর, জামালপুর — আমাদের গ্রাম, আমাদের গর্ব</p><div class="credit">© <span id="yr"></span> শাহবাজপুর পূর্বপাড়া</div></div></footer>
<a href="#home" id="top" aria-label="ওপরে যান"><i class="fas fa-arrow-up"></i></a>
<div id="modal"><div class="mb"><div id="mc"></div></div></div>
<script>
async function fetchJSON(path){
  try {
    const res = await fetch(path);
    if (!res.ok) {
      console.error('Fetch failed:', path, res.status);
      return null;
    }
    return await res.json();
  } catch (e) {
    console.error('Failed to load JSON:', path, e);
    return null;
  }
}
function normalizeCollection(data){
  if (Array.isArray(data)) return data;
  if (data && typeof data === 'object') return [data];
  return [];
}
async function loadData(){
  const village = await fetchJSON('data/village/index.json') || {};
  const news = normalizeCollection(await fetchJSON('data/news/index.json'));
  const people = normalizeCollection(await fetchJSON('data/people/index.json'));
  const mosque = normalizeCollection(await fetchJSON('data/mosque/index.json'));
  const school = normalizeCollection(await fetchJSON('data/school/index.json'));
  const madrasa = normalizeCollection(await fetchJSON('data/madrasa/index.json'));
  const graveyard = normalizeCollection(await fetchJSON('data/graveyard/index.json'));
  const bazar = normalizeCollection(await fetchJSON('data/bazar/index.json'));
  const mor = normalizeCollection(await fetchJSON('data/mor/index.json'));
  const volunteers = normalizeCollection(await fetchJSON('data/volunteers/index.json'));
  const dev = (await fetchJSON('data/dev/index.json')) || {name:'মোঃ কাওছার আহম্মেদ',email:'rvallagena2@gmail.com',fb:'https://www.facebook.com/normal.fb.user',photo:'',intro:'',edu:'সিভিল টেকনোলজি (ডিপ্লোমা), সিলেট সরকারি পলিটেকনিক ইনস্টিটিউট',map:'',phone:''};
  window.DATA={
    village: {...(Array.isArray(village) ? village[0] || {} : village), ward:'ওয়ার্ড - ৪ নং', union:'ইউনিয়ন - ১১ নং শাহবাজপুর ইউনিয়ন পরিষদ'},
    member:{},
    community:{},
    news,
    people,
    mosque,
    school,
    madrasa,
    graveyard,
    bazar,
    mor,
    volunteers,
    dev
  };
  build();clock();motion();extras();
}
function clean(a){return(a||[]).filter(x=>x&&(x.name||x.title)).map(x=>{if(x.shops)x.shops=clean(x.shops);return x})}
var BN=['০','১','২','৩','৪','৫','৬','৭','৮','৯'];function bn(n){return String(n).replace(/\d/g,d=>BN[d])}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
var FIELDS=[['title','পদবি'],['nick','ডাকনাম'],['house','বাড়ির নাম'],['type','ধরন'],['owner','দোকানদার'],['address','ঠিকানা']];
function acts(it,ml){var h='';if(it.phone)h+='<a href="tel:'+esc(it.phone)+'"><i class="fas fa-phone"></i> '+esc(it.phone)+'</a>';if(it.email)h+='<a href="mailto:'+esc(it.email)+'"><i class="fas fa-envelope"></i> '+esc(it.email)+'</a>';if(it.fb)h+='<a href="'+esc(it.fb)+'" target="_blank" rel="noopener"><i class="fab fa-facebook-f"></i> ফেসবুক</a>';if(it.map)h+='<a href="'+esc(it.map)+'" target="_blank" rel="noopener"><i class="fas fa-location-dot"></i> '+ml+'</a>';return h?'<div class="acts">'+h+'</div>':''}
function photo(src,icon,alt){
  if(src){
    if(src.startsWith('/')) src = src.substring(1);
  }
  return '<div class="ph"><i class="fas '+icon+'"></i>'+(src?'<img loading="lazy" src="'+esc(src)+'" alt="'+esc(alt)+'" onerror="this.style.display=\'none\'">':'')+'</div>';
}
function card(it,i,icon,ml){var rows='';FIELDS.forEach(f=>{if(it[f[0]])rows+='<div class="row"><b>'+f[1]+':</b> '+esc(it[f[0]])+'</div>'});var shops='';if(it.shops&&it.shops.length)shops='<div class="shops"><h5>দোকান / সেবা</h5><div class="grid">'+it.shops.map(x=>'<div class="card"><div class="ph">'+(x.photo?'<img src="'+esc(x.photo)+'" alt="'+esc(x.name||x.title)+'">':'<i class="fas '+icon+'"></i>')+'</div><div class="cb"><h4>'+esc(x.name||x.title||'')+'</h4>'+FIELDS.slice(0,3).map(f=>x[f[0]]?'<div class="row"><b>'+f[1]+':</b> '+esc(x[f[0]])+'</div>':'').join('')+'</div></div>').join('')+'</div></div>';
  return '<article class="card reveal" data-index="'+i+'">'+photo(it.photo,icon,it.name||it.title)+'<div class="cb"><h4>'+esc(it.name||it.title||'')+'</h4>'+(rows||'')+(it.about?'<div class="about">'+esc(String(it.about).slice(0,140))+(it.about.length>140?'...':'')+'</div>':'')+(it.address?'<div class="row"><b>ঠিকানা:</b> '+esc(it.address)+'</div>':'')+acts(it,ml)+shops+'</div></article>';
}
function emptyBox(){return '<div class="empty reveal"><i class="fas fa-hourglass-half"></i>এই তথ্য শীঘ্রই যোগ করা হবে।</div>'}
function grid(items,icon,ml){return items.length?'<div class="grid">'+items.map((x,i)=>card(x,i,icon,ml)).join('')+'</div>':emptyBox()}
function sec(id,title,icon,inner,count,note){return '<section class="sec" id="'+id+'"><div class="container"><div class="stitle reveal"><h3><i class="fas '+icon+'"></i> '+title+'</h3>'+(count!=null?'<em>'+bn(count)+'টি</em>':'')+'</div>'+(note?'<div class="note reveal">'+note+'</div>':'')+inner+'</div></section>'}
var S=[['people','পরিচিত মুখ','fa-user-group','fa-user','বাড়ির লোকেশন'],['mosque','মসজিদ','fa-mosque','fa-mosque','গুগল ম্যাপ'],['school','বিদ্যালয়','fa-school','fa-school','গুগল ম্যাপ'],['madrasa','মাদ্রাসা','fa-book-open','fa-book-open','গুগল ম্যাপ'],['bazar','বাজার','fa-store','fa-store','গুগল ম্যাপ'],['mor','মোড়','fa-road','fa-road','গুগল ম্যাপ'],['volunteers','স্বেচ্ছাসেবক','fa-users','fa-user-friends','যোগাযোগ'],['graveyard','গোরস্থান','fa-cross','fa-monument','গুগল ম্যাপ']];
function build(){
  var v=DATA.village||{},h='',nav=[['home','হোম','fa-home']];
  var bub='';for(var b=0;b<12;b++){var s=10+Math.random()*40;bub+='<span class="bub" style="left:'+(Math.random()*100)+'%;width:'+(s*1.6)+'px;height:'+(s*1.6)+'px;animation-duration:'+(18+Math.random()*10)+'s;opacity:'+(0.12+Math.random()*0.18)+'"></span>'}
  h+='<section class="hero" id="home">'+bub+'<div class="container"><div><small><i class="fas fa-heart"></i> স্বাগতম আমাদের গ্রামে</small><br><div class="ward">প্রধান তথ্য</div><h2>'+esc(v.name||'শাহবাজপুর পূর্বপাড়া')+'</h2><div class="sub">'+esc(v.intro||'আমাদের গ্রাম, আমাদের গর্ব')+'</div><div class="slogan">স্মার্ট, পরিচ্ছন্ন ও ঐতিহ্যবাহী আমাদের শাহবাজপুর পূর্বপাড়া</div><a class="btn" href="#people"><i class="fas fa-users"></i> পরিচিত মুখ</a><a class="btn" href="'+esc(v.map||'#')+'" target="_blank" rel="noopener"><i class="fas fa-location-dot"></i> ম্যাপে দেখুন</a></div><div class="hero-photo">'+(v.photo?'<img src="'+esc(v.photo)+'" alt="'+esc(v.name||'গ্রামের দৃশ্য')+'">':'<div style="display:grid;place-items:center;height:100%;color:#fff;background:linear-gradient(135deg,#1d2f4d,#d32f2f);font-size:40px"><i class="fas fa-landmark"></i></div>')+'</div></div></section>';
  h+='<div class="container"><div class="stats reveal"><div class="stat"><strong>'+bn((DATA.people||[]).length||0)+'</strong><span>পরিচিত মুখ</span></div><div class="stat"><strong>'+bn((DATA.mosque||[]).length||0)+'</strong><span>মসজিদ</span></div><div class="stat"><strong>'+bn((DATA.school||[]).length||0)+'</strong><span>বিদ্যালয়</span></div><div class="stat"><strong>'+bn((DATA.volunteers||[]).length||0)+'</strong><span>স্বেচ্ছাসেবক</span></div></div></div>';
  var tk=(DATA.news||[]).length?DATA.news.slice(0,10).map(n=>esc(n.title)).join(' &nbsp;|&nbsp; '):'শাহবাজপুর পূর্বপাড়া গ্রামের ওয়েবসাইটে আপনাকে স্বাগতম...';
  h+='<div class="container"><div class="breaking reveal"><div class="bl"><i class="fas fa-bolt"></i> ব্রেকিং নিউজ</div><div class="tk"><span>'+tk+'</span></div></div></div>';
  nav.push(['news','খবর','fa-newspaper']);
  var nh=(DATA.news||[]).length?'<div class="grid">'+(DATA.news||[]).map((n,i)=>'<div class="card reveal'+(i===0?' news-big':'')+(i>=6?' nh':'')+'" style="cursor:pointer" data-news="'+i+'"><span class="sn" style="position:absolute;top:12px;left:12px;background:rgba(211,47,47,.9);color:#fff;border-radius:999px;width:32px;height:32px;display:grid;place-items:center;font-size:14px;font-weight:700;">'+bn(i+1)+'</span>'+photo(n.photo,'fa-newspaper',n.title)+'<div class="cb">'+(n.cat?'<span class="tag" style="display:inline-block;background:#fbe9e7;color:var(--red);padding:4px 10px;border-radius:999px;font-size:12px;margin-bottom:8px;">'+esc(n.cat)+'</span>':'')+'<h4>'+esc(n.title)+'</h4>'+(n.date?'<div class="row"><i class="far fa-calendar-alt" style="color:var(--red)"></i> '+esc(n.date)+'</div>':'')+(n.text?'<div class="about">'+esc(String(n.text).slice(0,110))+(n.text.length>110?'...':'')+'</div>':'')+'</div></div>').join('')+'</div>'+(DATA.news.length>6?'<div style="text-align:center;margin-top:18px"><button class="btn" id="more" type="button"><i class="fas fa-circle-plus"></i> আরও খবর দেখুন ('+bn(DATA.news.length-6)+')</button></div>':''):emptyBox();
  h+=sec('news','সর্বশেষ খবর','fa-newspaper',nh,(DATA.news||[]).length);
  S.forEach(s=>{ nav.push([s[0],s[1],s[2]]); h+=sec(s[0],s[1],s[2],grid(DATA[s[0]]||[],s[3],s[4]),(DATA[s[0]]||[]).length); });
  nav.push(['dev','ডেভেলপার','fa-code']);
  var d=DATA.dev||{},dr='';
  if(d.name)dr+='<div class="row"><b>নাম:</b> '+esc(d.name)+'</div>';
  if(d.intro)dr+='<div class="row"><b>পরিচয়:</b> '+esc(d.intro)+'</div>';
  if(d.edu)dr+='<div class="row"><b>শিক্ষা:</b> '+esc(d.edu)+'</div>';
  if(d.email)dr+='<div class="row"><b>ইমেইল:</b> '+esc(d.email)+'</div>';
  if(d.phone)dr+='<div class="row"><b>ফোন:</b> '+esc(d.phone)+'</div>';
  if(d.fb)dr+='<div class="row"><b>ফেসবুক:</b> <a href="'+esc(d.fb)+'" target="_blank" rel="noopener">'+esc(d.fb)+'</a></div>';
  if(d.map)dr+='<div class="row"><b>ম্যাপ:</b> <a href="'+esc(d.map)+'" target="_blank" rel="noopener">'+esc(d.map)+'</a></div>';
  h+='<section class="sec" id="dev"><div class="container"><div class="dev reveal"><div class="hero-photo" style="height:180px;border-radius:16px">'+(d.photo?'<img src="'+esc(d.photo)+'" alt="'+esc(d.name||'ডেভেলপার')+'">':'<div style="display:grid;place-items:center;height:100%;color:#fff;background:linear-gradient(135deg,#0e1727,#d32f2f)"><i class="fas fa-code"></i></div>')+'</div><div>'+dr+'</div></div></div></section>';
  document.getElementById('app').innerHTML=h;document.getElementById('nav').innerHTML=nav.map((n,i)=>'<a href="#'+n[0]+'"'+(i===0?' class="active"':'')+'><i class="fas '+n[2]+'"></i> '+n[1]+'</a>').join('');
  document.getElementById('searchInput').addEventListener('input',function(){
    const q=this.value.trim().toLowerCase();
    const cards=document.querySelectorAll('.card');
    cards.forEach(card=>{
      const txt=(card.textContent||'').toLowerCase();
      card.style.display=txt.includes(q)?'':'none';
    });
  });
}
function motion(){var els=document.querySelectorAll('.reveal');if(!('IntersectionObserver'in window)){els.forEach(e=>e.classList.add('in'))}else{var io=new IntersectionObserver(en=>en.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}));els.forEach(e=>io.observe(e))}}
function clock(){
  const days=['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'];
  const now=new Date();
  document.getElementById('dynamic-date').textContent = days[now.getDay()] + ', ' + now.toLocaleDateString('bn-BD', { day: 'numeric', month: 'long', year: 'numeric' });
  document.getElementById('dynamic-time').textContent = now.toLocaleTimeString('bn-BD', { hour: 'numeric', minute: '2-digit', second: '2-digit' });
}
function extras(){document.getElementById('yr').textContent=bn(new Date().getFullYear());}
document.addEventListener('DOMContentLoaded',loadData);
</script>
</body>
</html>
